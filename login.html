<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Educacional - Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container" id="login-container">
    <div class="login-icon">
    <svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 24 24" fill="white">
        <path d="M12 3L1 9l11 6 9-4.91V17h2V9L12 3zM5 13.18v4L12 21l7-3.82v-4L12 17l-7-3.82z"/>
    </svg>
</div>
        <h2>Bem-vindo ao Ecossistema Educacional</h2>
        <p class="login-subtitle">Faça login para continuar sua jornada</p>

        <!-- Formulário de Login -->
        <form id="login-form" style="display:flex; flex-direction:column; gap:10px;">
            <input type="email" id="email" placeholder="E-mail" required>
            <input type="password" id="senha" placeholder="Senha" required>
            <button type="submit">Entrar</button>
            <button type="button" id="btn-mostrar-cadastro" class="btn-secundario">Primeiro Acesso</button>
        </form>

        <!-- Formulário de Cadastro (oculto por padrão) -->
        <form id="cadastro-form" style="display:none; flex-direction:column; gap:10px;">
            <h3 style="margin:0 0 8px 0;">Criar Conta</h3>
            <input type="text" id="cadastro-nome" placeholder="Nome completo" required>
            <input type="email" id="cadastro-email" placeholder="E-mail" required>
            <input type="password" id="cadastro-senha" placeholder="Crie sua senha" required>
            <button type="submit">Cadastrar</button>
            <button type="button" id="btn-voltar-login" class="btn-secundario">Voltar ao Login</button>
        </form>

        <p id="mensagem"></p>
    </div>
    <script src="script.js"></script>
</body>
</html>
